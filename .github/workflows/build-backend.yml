name: Build backend image

# Manual only - this exists to push a backend image to Azure Container Registry
# (inteltionhracr.azurecr.io) for the Azure Container Apps deploy. ACR Tasks
# (cloud-side `az acr build`) is blocked on the Azure for Students subscription
# this project uses, and the dev machine can't run Docker locally (no nested
# virtualization), so this workflow is the build path instead.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag to push, e.g. round5"
        required: true
        default: "latest"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/inteltion-backend:${{ inputs.image_tag }}
